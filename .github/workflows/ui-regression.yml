name: KARVAN UI regression tests
on:
  push:
    paths:
      - .github/workflows/ui-regression.yml
      - index.html
      - karvan-i18n-data.js
      - karvan-i18n.js
      - karvan-menu.js
      - karvan-menu.css
      - assets/css/karvan-premium.css
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up browser tests
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install --with-deps chromium; fi
      - name: Verify all navigation, filters, forms and photos
        shell: bash
        run: |
          python3 -m http.server 8088 >/tmp/karvan-http.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
          const checks=[];
          async function test(name,fn){try{await fn();checks.push('PASS '+name)}catch(e){checks.push('FAIL '+name+': '+e.message);throw e}}
          for(const mode of ['desktop','tablet','mobile']){
            const page=await browser.newPage({viewport:mode==='mobile'?{width:390,height:844}:mode==='tablet'?{width:768,height:1024}:{width:1440,height:900},isMobile:mode!=='desktop',hasTouch:mode!=='desktop'});
            const errs=[];page.on('pageerror',e=>errs.push(e.message));
            await page.goto('http://127.0.0.1:8088/',{waitUntil:'domcontentloaded'});
            await test(mode+' default German homepage',async()=>{assert.equal(await page.locator('#de-index').isVisible(),true)});
            await test(mode+' all 40 routes in five languages',async()=>{
              for(const l of ['de','en','fa','tr','ar'])for(const name of ['index','leistungen','projekte','ueber-uns','kontakt','anfrage','impressum','datenschutz']){
                await page.evaluate(h=>location.hash=h,l+'-'+name);
                assert.equal(await page.locator('#'+l+'-'+name).isVisible(),true,l+'-'+name+' not visible');
                assert.equal(await page.locator('.virtual-page[data-active="true"]').count(),1,'many visible pages');
              }
            });
            await page.evaluate(()=>location.hash='de-projekte');
            await test(mode+' five-language selector keeps current route',async()=>{
              const de=page.locator('.chrome-de .karvan-lang-control');
              assert.equal(await de.count(),1,'Language selector missing');
              await de.selectOption('fa');
              await page.waitForFunction(()=>document.querySelector('#fa-projekte')?.dataset.active==='true',{timeout:5000});
              assert.equal(await page.locator('#fa-projekte').isVisible(),true);
              assert.equal(await page.locator('html').getAttribute('dir'),'rtl');
              await page.locator('.chrome-fa .karvan-lang-control').selectOption('ar');
              await page.waitForFunction(()=>document.querySelector('#ar-projekte')?.dataset.active==='true',{timeout:5000});
              assert.equal(await page.locator('html').getAttribute('dir'),'rtl');
              await page.locator('.chrome-ar .karvan-lang-control').selectOption('tr');
              await page.waitForFunction(()=>document.querySelector('#tr-projekte')?.dataset.active==='true',{timeout:5000});
              assert.equal(await page.locator('html').getAttribute('dir'),'ltr');
              await page.locator('.chrome-tr .karvan-lang-control').selectOption('en');
              await page.waitForFunction(()=>document.querySelector('#en-projekte')?.dataset.active==='true',{timeout:5000});
              await page.locator('.chrome-en .karvan-lang-control').selectOption('de');
              await page.waitForFunction(()=>document.querySelector('#de-projekte')?.dataset.active==='true',{timeout:5000});
            });
            await test(mode+' 16 project photos and filtering',async()=>{
              assert.equal(await page.locator('#de-projekte .project-tile').count(),16);
              let img=await page.locator('#de-projekte .project-tile img').evaluateAll(xs=>xs.map(x=>x.getAttribute('src')));
              assert.equal(img.length,16);assert.equal(new Set(img).size,16);
              await page.locator('#de-projekte [data-filter="bathroom"]').click();
              assert.equal(await page.locator('#de-projekte .project-tile:not([hidden])').count(),1);
              await page.locator('#de-projekte [data-filter="all"]').click();
            });
            await test(mode+' gallery photo modal',async()=>{
              await page.locator('#de-projekte .project-tile button.project-image').first().click();
              assert.equal(await page.locator('#de-projekte dialog[open]').count(),1);
              await page.locator('#de-projekte [data-next]').click();
              await page.locator('#de-projekte [data-close]').click();
              assert.equal(await page.locator('#de-projekte dialog[open]').count(),0);
            });
            await test(mode+' all in-page link targets exist',async()=>{
              const bad=await page.evaluate(()=>[...document.querySelectorAll('a[href^="#"]')].filter(a=>!document.getElementById(a.hash.slice(1))).map(a=>a.href));
              assert.equal(bad.length,0,JSON.stringify(bad));
            });
            await page.evaluate(()=>location.hash='de-anfrage');
            await test(mode+' email form validation + AJAX submission',async()=>{
              await page.route('https://formsubmit.co/ajax/**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:'true',message:'Sent'})}));
              const form=page.locator('#enquiryForm-de');
              assert.equal(await form.locator('[name=fullname]').getAttribute('required'),null);
              assert.equal(await form.locator('[name=phone]').getAttribute('required'),null);
              assert.equal(await form.locator('[name=email]').getAttribute('required'),'');
              await form.locator('[name=email]').fill('test@example.com');
              await form.locator('[name=service]').selectOption({index:1});
              await form.locator('[name=message]').fill('Test project inquiry for the automated verification.');
              await form.locator('[name=consent]').check();
              await form.locator('button[data-channel="email"]').click();
              await page.waitForTimeout(450);
              assert.match(await form.locator('.form-feedback').innerText(),/Anfrage an den Formular-Dienst|Anfrage.*übergeben/);
            });
            await test(mode+' activation failure provides filled Email and WhatsApp fallback',async()=>{
              await page.unroute('https://formsubmit.co/ajax/**');
              await page.route('https://formsubmit.co/ajax/**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:'false',message:'This form needs Activation. Check your email to activate.'})}));
              await page.evaluate(()=>location.hash='de-anfrage');
              const form=page.locator('#enquiryForm-de');
              await form.locator('[name=email]').fill('test@example.com');
              await form.locator('[name=service]').selectOption({index:1});
              await form.locator('[name=message]').fill('Reference project details for a test request');
              await form.locator('[name=consent]').check();
              await form.locator('button[data-channel="email"]').click();
              await page.waitForFunction(()=>document.querySelector('#formFeedback-de')?.dataset.state==='error',{timeout:5000});
              const feedback=await form.locator('.form-feedback').innerText();
              assert.match(feedback,/aktiviert|Aktivierungs-E-Mail/i);
              const mail=await form.locator('.karvan-mailto-fallback').getAttribute('href');
              assert.ok(mail.startsWith('mailto:info@karvan-design.de?'));
              assert.ok(decodeURIComponent(mail).includes('Reference project details for a test request'));
              const directWA=await form.locator('.alt-whatsapp').evaluate(a=>{const event=new MouseEvent('click',{bubbles:true,cancelable:true});a.addEventListener('click',e=>e.preventDefault(),{once:true});a.dispatchEvent(event);return a.getAttribute('href')});
              assert.ok(directWA.includes('phone=4917672161005'));
              assert.ok(decodeURIComponent(directWA).includes('Reference project details for a test request'));
            });
            await test(mode+' WhatsApp contact URL',async()=>{
              const a=await page.locator('.floating-whatsapp').getAttribute('href');
              assert.match(a,/api.whatsapp.com\/send\?phone=4917672161005/);
              await page.route('https://api.whatsapp.com/**',route=>route.fulfill({status:200,contentType:'text/html',body:'WhatsApp destination verified'}));
              const form=page.locator('#enquiryForm-de');
              assert.equal(await form.locator('[name=fullname]').getAttribute('required'),null);
              assert.equal(await form.locator('[name=phone]').getAttribute('required'),null);
              assert.equal(await form.locator('[name=email]').getAttribute('required'),'');
              await form.locator('[name=email]').fill('test@example.com');
              await form.locator('[name=service]').selectOption({index:1});
              await form.locator('[name=message]').fill('Test WhatsApp project request');
              await form.locator('[name=consent]').check();
              await form.locator('button[data-channel="wa"]').click();
              await page.waitForURL(/api.whatsapp.com/,{timeout:6000});
              assert.match(page.url(),/phone=4917672161005/);
              await page.goto('http://127.0.0.1:8088/#de-index',{waitUntil:'load'});
            });
            await test(mode+' hero photo has no text overlay on small screens',async()=>{
              for(const l of ['de','en','fa','tr','ar']){
                await page.evaluate(h=>location.hash=h,l+'-index');
                await page.waitForFunction(x=>document.querySelector('#'+x)?.dataset.active==='true',l+'-index');
                const data=await page.locator('#'+l+'-index').evaluate(root=>{
                  const photo=root.querySelector('.hero-home .hero-photo');
                  const text=root.querySelector('.hero-home .hero-panel');
                  const badge=root.querySelector('.hero-photo-badge');
                  return {
                    imageBottom:photo.getBoundingClientRect().bottom,
                    textTop:text.getBoundingClientRect().top,
                    badgeHidden:getComputedStyle(badge).display==='none'
                  };
                });
                assert.equal(data.badgeHidden,true,l+' badge remains on photo');
                if(mode!=='desktop')assert.ok(data.textTop>=data.imageBottom-2,
                  l+' content overlaps photo: '+JSON.stringify(data));
              }
              await page.evaluate(()=>location.hash='de-index');
            });
            await test(mode+' localized forms and gentle photo animation',async()=>{
              for(const l of ['fa','tr','ar']){
                const form=page.locator('#enquiryForm-'+l);
                assert.equal(await form.count(),1,l+' form missing');
                assert.equal(await form.locator('[name=email]').getAttribute('required'),'');
                assert.equal(await form.locator('[name=phone]').getAttribute('required'),null);
              }
              const motion=await page.locator('#de-index .hero-photo img').evaluate(el=>getComputedStyle(el).animationName);
              assert.match(motion,/karvanHeroSlowZoom/);
            });
            await test(mode+' modern design stylesheet loaded',async()=>{
              const ok=await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--k-background').trim()==='#f7f8f7');
              assert.equal(ok,true,'Premium CSS not applied');
            });
            await test(mode+' creator attribution and secure link',async()=>{
              await page.evaluate(()=>location.hash='de-index');
              const a=page.locator('.chrome-de .footer-creator a');
              assert.equal(await a.count(),1);
              assert.equal(await a.getAttribute('href'),'https://azarqrcod.github.io/azarcore/');
              await page.evaluate(()=>location.hash='en-index');
              assert.equal(await page.locator('.chrome-en .footer-creator a').count(),1);
            });
            await test(mode+' no horizontal viewport overflow',async()=>{
              await page.evaluate(()=>location.hash='de-index');
              const d=await page.evaluate(()=>({width:document.documentElement.scrollWidth,window:window.innerWidth}));
              assert.ok(d.width<=d.window+2,JSON.stringify(d));
            });
            if(mode!=='desktop'){
              await test(mode+' mobile menu works',async()=>{
                await page.evaluate(()=>location.hash='de-index');
                const menu=page.locator('.chrome-de details.mobile-nav-native');
                await menu.locator('summary').click();
                assert.equal(await menu.getAttribute('open'),'');
                await menu.locator('a[href="#de-projekte"]').click();
                await page.waitForFunction(()=>document.querySelector('#de-projekte')?.dataset.active==='true',{timeout:5000});
                assert.equal(await page.locator('#de-projekte').isVisible(),true);
                await page.waitForFunction(()=>!document.querySelector('.chrome-de details.mobile-nav-native')?.hasAttribute('open'),{timeout:5000});
                assert.equal(await menu.getAttribute('open'),null);
              });
            }
            await test(mode+' professional menu design and all five language actions',async()=>{
              for(const l of ['de','en','fa','tr','ar']){
                await page.evaluate(lang=>location.hash=lang+'-index',l);
                await page.waitForFunction(lang=>document.querySelector('#'+lang+'-index')?.dataset.active==='true',l);
                const menu=page.locator('.chrome-'+l+' details.mobile-nav-native');
                assert.equal(await menu.count(),1,'Missing '+l+' menu');
                assert.equal(await menu.locator('.k-menu-link').count(),5,l+' links not built');
                assert.equal(await menu.locator('.k-menu-quote').getAttribute('href'),'#'+l+'-anfrage');
                assert.equal(await menu.locator('.k-menu-footer a').count(),2);
                const wa=await menu.locator('.k-menu-wa').getAttribute('href');
                assert.match(wa,/api.whatsapp.com\/send\?phone=4917672161005/);
                const email=await menu.locator('.k-menu-direct-link').last().getAttribute('href');
                assert.equal(email,'mailto:info@karvan-design.de');
                if(mode!=='desktop'){
                  await menu.locator('summary').click();
                  await page.waitForFunction(lang=>document.querySelector('.chrome-'+lang+' .mobile-nav-native')?.open===true,l);
                  assert.equal(await menu.locator('.k-menu-drawer').isVisible(),true);
                  const dims=await menu.locator('.k-menu-drawer').boundingBox();
                  assert.ok(dims&&dims.x>=0&&dims.width>240&&dims.height>300,JSON.stringify(dims));
                  assert.ok(dims.y>=0&&dims.y+dims.height<=page.viewportSize().height+2,JSON.stringify(dims));
                  await menu.locator('a.k-menu-quote').click();
                  await page.waitForFunction(lang=>document.querySelector('#'+lang+'-anfrage')?.dataset.active==='true',l);
                  assert.equal(await menu.getAttribute('open'),null);
                  await menu.locator('summary').click();
                  await page.keyboard.press('Escape');
                  await page.waitForFunction(lang=>!document.querySelector('.chrome-'+lang+' .mobile-nav-native')?.open,l);
                  await menu.locator('summary').click();
                  await menu.locator('a[href="#'+l+'-projekte"]').click();
                  await page.waitForFunction(lang=>document.querySelector('#'+lang+'-projekte')?.dataset.active==='true',l);
                  assert.equal(await menu.getAttribute('open'),null);
                }
              }
              await page.evaluate(()=>location.hash='de-index');
            });
            await test(mode+' key actions, consent, accessibility and search visibility',async()=>{
              assert.equal(await page.locator('meta[name="robots"]').getAttribute('content'),'index, follow');
              const buttons=await page.locator('#de-index .hero-buttons a[href^="#"]').evaluateAll(xs=>xs.map(a=>a.getAttribute('href')));
              assert.ok(buttons.includes('#de-anfrage'),'Main quote button missing');
              for(const selector of ['#de-kontakt a[href^="mailto:"]','#de-kontakt a[href*="wa.me"],#de-kontakt a[href*="api.whatsapp.com"]']){
                assert.ok(await page.locator(selector).count()>0,selector);
              }
              const bad=await page.evaluate(()=>[...document.querySelectorAll('a[href^="#"]')]
                .filter(a=>!document.getElementById(a.getAttribute('href').slice(1)))
                .map(a=>a.getAttribute('href')));
              assert.deepEqual(bad,[]);
            });
            await test(mode+' no script runtime errors',async()=>assert.equal(errs.length,0,errs.join(';')));
            await page.close();
          }
          console.log(checks.join('\n'));
          await browser.close();
          JS
