name: Check Pages TLS reset state
on:
  push:
    paths:
      - CNAME
      - .github/workflows/tls-reset-check.yml
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pages: read
      contents: read
    steps:
      - name: Query Pages TLS state and certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PAGES CONFIG"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/azarqrcod/karvan-site/pages" | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ("cname","html_url","https_certificate","https_enforced","status","protected_domain_state")})'
          echo "TLS CERTIFICATE"
          echo | timeout 15 openssl s_client -connect karvan-design.de:443 -servername karvan-design.de 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>&1 | head -n 9 || true
