name: Verify KARVAN HTTPS certificate
on:
  push:
    paths:
      - .github/workflows/tls-reset-check.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      pages: read
      contents: read
    steps:
      - name: Check certificate issuance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Check $i"
            response=$(curl -sS --max-time 12 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/azarqrcod/karvan-site/pages)
            echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ("cname","status","https_certificate","https_enforced")})'
            state=$(echo "$response" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("https_certificate") or {}).get("state") or "none")')
            if [ "$state" = "approved" ]; then break; fi
            sleep 12
          done
          echo "Final HTTPS test:"
          curl -sS -I --max-time 12 https://karvan-design.de 2>&1 | head -n 12 || true
