name: Recheck KARVAN custom domain
on:
  push:
    paths:
      - .github/workflows/recheck-domain.yml
  workflow_dispatch:
jobs:
  request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Re-apply custom domain through GitHub Pages API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/result.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"cname":"karvan-design.de"}' https://api.github.com/repos/azarqrcod/karvan-site/pages)
          echo "Pages update HTTP status: $code"
          if [ "$code" != "204" ]; then cat /tmp/result.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("message","No message"))' ; fi
          echo "Current Pages certificate state:"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/azarqrcod/karvan-site/pages | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ("cname","https_certificate","https_enforced","status","message")})'
